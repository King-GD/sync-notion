name: weread sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    name: Sync
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ 只跑微信读书
      - name: weread sync
        id: weread-sync
        run: |
          python main.py sync_read "${{ secrets.WEREAD_COOKIE }}" "${{ secrets.NOTION_TOKEN }}" "${{ secrets.NOTION_DATABASE_ID }}" \
            --calendar_db_id="${{ secrets.NOTION_DATABASE_CALENDAR }}" \
            --wxnotify_key="${{ secrets.SCKEY }}"

      # ❌ 不跑 Trending（注释/删掉）
      # - name: trending sync
      #   id: trending-sync
      #   run: |
      #     python main.py sync_trending "${{secrets.NOTIO_
